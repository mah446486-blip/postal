name: build postal
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          if [! -d "android" ]; then
            flutter create. --platforms=android --project-name postal --org com.postal.app
          fi
          flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: postal-apk
          path: build/app/outputs/flutter-apk/app-release.apk