name: build breedy
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - run: |
          if [ -d "مكتبة" ]; then mkdir -p lib; cp -r "مكتبة"/* lib/ || true; fi
      - run: flutter create --project-name breedy --org com.breedy --platforms=android --overwrite
      - run: |
          if [ -d "مكتبة" ]; then cp -r "مكتبة"/* lib/ || true; fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: breedy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
